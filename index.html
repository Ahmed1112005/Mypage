<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>عداد التسبيح</title>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      text-align: center;
      background-color: #f0f8ff;
      padding-top: 50px;
      direction: rtl;
    }

    h1 {
      color: #333;
    }

    .button {
      font-size: 24px;
      padding: 15px 30px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .subhan {
      background-color: #7fc8f8;
      color: white;
    }

    .hamd {
      background-color: #81c784;
      color: white;
    }

    .akbar {
      background-color: #ffb74d;
      color: white;
    }

    .score {
      background-color: #673ab7;
      color: white;
      font-size: 24px;
      padding: 15px 30px;
      border: none;
      border-radius: 10px;
      margin-top: 20px;
    }

    .button:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <h1>عداد التسبيح</h1>

  <button class="button subhan" onclick="increaseCount()">سبحان الله</button>
  <button class="button hamd" onclick="increaseCount()">الحمد لله</button>
  <button class="button akbar" onclick="increaseCount()">الله أكبر</button>

  <br>
  <button class="score" disabled>Score: <span id="score">0</span></button>

  <script>
    let count = 0;

    function increaseCount() {
      count++;
      document.getElementById('score').innerText = count;
    }
  </script>
<p> My Name: Ahmed Abd Elati</p>
</body>
</html>
